services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "users"
    ports:
      - "5432:5432"

  app:
    build: ./app
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      POSTGRES_JDBC_URL: "jdbc:postgresql://postgres:5432/users"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      OTEL_SERVICE_NAME: "java-postgres-docker"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://app.trace0hq.com/api"
      OTEL_EXPORTER_OTLP_HEADERS: "X-API-KEY=YOUR_TRACE0_ENV_API_KEY"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
