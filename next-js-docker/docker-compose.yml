services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    depends_on:
      - dynamodb-local
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      USERS_TABLE_NAME: "users"
      DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
      AWS_REGION: "local"
      OTEL_SERVICE_NAME: "next-js-docker-backend"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://app.trace0hq.com/api"
      OTEL_EXPORTER_OTLP_HEADERS: "X-API-KEY=YOUR_TRACE0_ENV_API_KEY"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      BACKEND_API_URL: "http://backend:4000"
      OTEL_SERVICE_NAME: "next-js-docker-frontend"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://app.trace0hq.com/api"
      OTEL_EXPORTER_OTLP_HEADERS: "X-API-KEY=YOUR_TRACE0_ENV_API_KEY"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
